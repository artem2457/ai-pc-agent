# Froxlor SSL vhost: bot.holderchat.com ONLY
# File: /etc/apache2/sites-enabled/34_froxlor_ssl_vhost_bot.holderchat.com.conf
# Add INSIDE <VirtualHost *:443> (after SSL lines, before </VirtualHost>):
#
# IMPORTANT: Do NOT copy holderchat.com main domain config here.
# Main domain uses port 8001 (Django). This subdomain uses 8010 (ai-pc-agent Docker).

ProxyRequests Off
ProxyPreserveHost On
SSLProxyEngine On

# WebSocket for agent — BEFORE general ProxyPass, port 8010 NOT 8001
ProxyPass /ws/ ws://127.0.0.1:8010/ws/
ProxyPassReverse /ws/ ws://127.0.0.1:8010/ws/

# Everything else (HTML, API, MCP)
ProxyPass / http://127.0.0.1:8010/
ProxyPassReverse / http://127.0.0.1:8010/

# After adding, run as root:
#   a2enmod proxy proxy_http proxy_wstunnel ssl
#   apache2ctl configtest
#   systemctl reload apache2
#
# Test WebSocket:
#   curl -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" \
#     -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" -H "Sec-WebSocket-Version: 13" \
#     https://bot.holderchat.com/ws/agent
# Expected: HTTP/1.1 101 Switching Protocols
#
# Froxlor: paste into "Eigene Apache-Konfiguration" for bot.holderchat.com
