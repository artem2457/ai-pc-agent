# Froxlor SSL vhost: /etc/apache2/sites-enabled/34_froxlor_ssl_vhost_bot.holderchat.com.conf
# Add INSIDE <VirtualHost *:443> (after SSL lines, before </VirtualHost>):

ProxyPreserveHost On
ProxyRequests Off
ProxyPass / http://127.0.0.1:8010/
ProxyPassReverse / http://127.0.0.1:8010/

# WebSocket for /ws/agent
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /(.*) ws://127.0.0.1:8010/$1 [P,L]

# Optional: keep Let's Encrypt HTTP-01 working if needed elsewhere
# ProxyPass /.well-known !

# After adding, run as root:
#   a2enmod proxy proxy_http proxy_wstunnel rewrite
#   apache2ctl configtest
#   systemctl reload apache2
#
# Froxlor may overwrite manual edits on domain save — prefer "Eigene Apache-Konfiguration"
# in Froxlor domain settings for persistence.
