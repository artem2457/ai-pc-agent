services:
  server:
    image: ${IMAGE:?set IMAGE to ghcr.io/owner/repo:tag}
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
