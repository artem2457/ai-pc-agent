services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
