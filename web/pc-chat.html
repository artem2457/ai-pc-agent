<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Чат — AI PC Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="pc-chat">
  <header>
    <strong>Чат с ботом</strong>
    <span id="who" class="muted">Подключение…</span>
  </header>
  <main>
    <p id="boot-err" class="err"></p>
    <div id="chat"></div>
    <form id="chat-form" class="row chat-form">
      <input id="chat-in" autocomplete="off" placeholder="Любая команда для этого ПК..." />
      <button id="btn-send" type="submit">Отправить</button>
    </form>
    <p id="chat-err" class="err"></p>
  </main>
  <script src="/static/pc-chat.js"></script>
</body>
</html>
