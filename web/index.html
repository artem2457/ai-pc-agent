<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI PC Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="auth" class="card wrap">
    <h1>AI PC Agent</h1>
    <p class="muted">Подключи ПК и управляй им через <a href="https://grok.com" target="_blank">Grok Bot</a>.</p>
    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="пароль" />
    <div class="row">
      <button id="btn-login">Войти</button>
      <button id="btn-reg" class="ghost">Регистрация</button>
    </div>
    <p id="auth-err" class="err"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <strong>AI PC Agent</strong>
      <span id="who" class="muted"></span>
      <a class="dl" href="https://grok.com" target="_blank">Open Grok</a>
      <button id="btn-out" class="ghost">Выйти</button>
    </header>

    <div class="layout">
      <aside>
        <h2>Устройства</h2>
        <div id="devices"></div>
        <h2>Подключить ПК</h2>
        <input id="stick-label" placeholder="USB Agent" />
        <button id="btn-stick">Создать токен</button>
        <p class="muted">Запусти агент на ПК или флешку — устройство появится слева.</p>
        <p><a class="dl" href="/usb-maker.bat">Скачать программу флешки</a></p>
        <div id="sticks"></div>
      </aside>
      <main>
        <div id="empty" class="muted">Выбери устройство — здесь лог команд от Grok</div>
        <div id="panel" class="hidden">
          <h2 id="dev-title"></h2>
          <p id="dev-meta" class="muted"></p>
          <h3>Лог команд</h3>
          <div id="logs"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
